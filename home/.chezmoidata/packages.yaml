# System packages. To add one, add a line here: `command` is what gets checked,
# `brew` applies to Linux, WSL and macOS, `winget` applies to Windows.
# `winget_command` overrides `command` on Windows, where some names differ.
# An entry without `command` is always passed to the package manager.
packages:
  - { command: git, brew: git, winget: Git.Git }
  - { command: nvim, brew: neovim, winget: Neovim.Neovim }
  - { command: rg, brew: ripgrep, winget: BurntSushi.ripgrep.MSVC }
  - { command: fd, brew: fd, winget: sharkdp.fd }
  - { command: fzf, brew: fzf, winget: junegunn.fzf }
  - { command: lazygit, brew: lazygit, winget: JesseDuffield.lazygit }
  - { command: fnm, brew: fnm, winget: Schniz.fnm }
  - { command: go, brew: go, winget: GoLang.Go }
  - { command: python3, brew: python, winget: Python.Python.3.14, winget_command: python }
  - { command: gcc, brew: gcc, winget: BrechtSanders.WinLibs.POSIX.UCRT }
  - { command: unzip, brew: unzip }
  - { winget: DEVCOM.JetBrainsMonoNerdFont }
